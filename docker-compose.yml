services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrupa}
      POSTGRES_USER: ${POSTGRES_USER:-agrupa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrupa}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./Backend-Alunos-main
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-agrupa}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agrupa}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-agrupa}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend-Alunos-main
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
